# Переменные с значениями по умолчанию можно переопределить через окружение хоста или файл `.env`
# (шаблон — `.env.example`; скопируйте его в `.env`, чтобы задать свои значения).
name: usersapp

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usersapp
      POSTGRES_USER: usersapp
      POSTGRES_PASSWORD: usersapp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usersapp -d usersapp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: usersapp
      DB_USER: usersapp
      DB_PASSWORD: usersapp
      SEED_ENABLED: "${SEED_ENABLED:-true}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:-admin12345}"
    ports:
      - "8081:8080"
    restart: unless-stopped

  # On-demand browser for end-to-end tests. It joins this stack's network so the suite talks to
  # the app over its service name regardless of how the host publishes ports:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    depends_on:
      app:
        condition: service_started
    environment:
      E2E_BASE_URL: http://app:8080
      CI: "true"
    working_dir: /work
    volumes:
      - ./e2e:/work
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]

volumes:
  db-data:
