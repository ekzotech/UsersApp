<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Пользователи', ~{::content})}">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
</head>
<body>
<main th:fragment="content">
    <h1>Пользователи</h1>

    <form class="search" th:action="@{/users}" method="get" role="search">
        <label for="q">Поиск по ФИО или email</label>
        <input type="search" id="q" name="q" th:value="${q}" placeholder="Например, Анна">
        <button type="submit">Найти</button>
        <p th:if="${q != null and !#strings.isEmpty(q)}"><a th:href="@{/users}">Сбросить</a></p>
    </form>

    <section>
        <h2 th:text="'Студенты (' + ${#lists.size(students)} + ')'">Студенты (0)</h2>
        <p th:if="${canAdminister}"><a th:href="@{/students/new}">+ Студент</a></p>
        <table class="data" th:if="${!#lists.isEmpty(students)}">
            <thead>
            <tr>
                <th scope="col">ФИО</th>
                <th scope="col">Email</th>
                <th scope="col">Группа</th>
                <th scope="col">Статус</th>
                <th scope="col">Куратор</th>
                <th scope="col">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td data-label="ФИО" th:text="${s.fullName}">Анна Смирнова</td>
                <td data-label="Email" th:text="${s.email}">anna@example.com</td>
                <td data-label="Группа" th:text="${s.groupName}">ИС-11</td>
                <td data-label="Статус" th:text="${s.displayStatus}">Активен</td>
                <td data-label="Куратор" th:text="${s.curator != null ? s.curator.fullName : '—'}">—</td>
                <td data-label="Действия">
                    <form th:if="${s.active and canAdminister}" th:action="@{/students/{id}/deactivate(id=${s.id})}" method="post">
                        <button type="submit" class="link-button">Деактивировать</button>
                    </form>
                    <form th:if="${!s.active and canAdminister}" th:action="@{/students/{id}/activate(id=${s.id})}" method="post">
                        <button type="submit" class="link-button">Активировать</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(students)}">Ничего не найдено.</p>
    </section>

    <section>
        <h2 th:text="'Преподаватели (' + ${#lists.size(teachers)} + ')'">Преподаватели (0)</h2>
        <p th:if="${canAdminister}"><a th:href="@{/teachers}">Управление преподавателями</a></p>
        <table class="data" th:if="${!#lists.isEmpty(teachers)}">
            <thead>
            <tr>
                <th scope="col">ФИО</th>
                <th scope="col">Email</th>
                <th scope="col">Статус</th>
                <th scope="col">Роль</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${teachers}">
                <td data-label="ФИО"><a th:href="@{/teachers/{id}(id=${t.id})}" th:text="${t.fullName}">Иван Иванов</a></td>
                <td data-label="Email" th:text="${t.email}">ivanov@example.com</td>
                <td data-label="Статус" th:text="${t.displayStatus}">Активен</td>
                <td data-label="Роль">
                    <span class="badge" th:if="${t.curator}">Куратор</span>
                    <span th:unless="${t.curator}">—</span>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(teachers)}">Ничего не найдено.</p>
    </section>
</main>
</body>
</html>
