<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — UsersApp'">UsersApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">UsersApp</a>
    <nav>
        <a th:href="@{/users}">Пользователи</a>
        <form th:action="@{/logout}" method="post"><button type="submit" class="link-button">Выйти</button></form>
    </nav>
</header>
<main>
    <p th:if="${param.logout}" class="flash success">Вы вышли из системы.</p>
    <p th:if="${success}" class="flash success" th:text="${success}">Готово</p>
    <p th:if="${error}" class="flash error" th:text="${error}">Ошибка</p>
    <th:block th:replace="${content}"/>
</main>
</body>
</html>
