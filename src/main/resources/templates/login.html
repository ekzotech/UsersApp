<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Вход', ~{::content})}">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<main th:fragment="content">
    <h1>Вход</h1>
    <p th:if="${param.error}" class="flash error">Неверный логин или пароль.</p>
    <p th:if="${param.logout}" class="flash success">Вы вышли из системы.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Логин</label>
        <input id="username" type="text" name="username" autocomplete="username" autofocus>
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="current-password">
        <button type="submit">Войти</button>
    </form>
</main>
</body>
</html>
