spring.application.name=usersapp

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usersapp}
spring.datasource.username=${DB_USER:usersapp}
spring.datasource.password=${DB_PASSWORD:usersapp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

# Demo data is filled on startup by seed/SeedRunner, which lives in the default "seed" profile.
spring.profiles.default=seed
# The default pool of 10 is more than the compose database needs; keep one pool per app instance small.
spring.datasource.hikari.maximum-pool-size=5

app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${APP_ADMIN_PASSWORD:admin12345}
