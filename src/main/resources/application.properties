spring.application.name=usersapp

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usersapp}
spring.datasource.username=${DB_USER:usersapp}
spring.datasource.password=${DB_PASSWORD:usersapp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
